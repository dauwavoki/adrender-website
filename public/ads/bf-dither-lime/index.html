<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<body><canvas id="c"></canvas>
<script src="/ads/lib/core.js"></script>
<script>
// Ad 2: Black Friday in ordered pixel dithering (Bayer 8x8), black and lime.
// Motion system: Premium/Energetic mix, standard enter curve, exit curve, 1/3 rule for every sequence.
// Influences: node-graph AI dashboard (dark cards, green wires), bento stat grid, procedural nature growth (phyllotaxis).
const A = AD, { PHONE, W, H, SCALE, clamp01, lerp, prog, sine, EASE, third, ctx, mk, begin, IMG, drawCover, words, ditherField, ditherSource, dissolve, pixelWipe, logo, B8 } = A;
const TOTAL = 36;
const BLACK = '#050605', LIME = '#C8FF2E', DIM = '#1B2410', CARD = '#0C0E0A', LINE = '#232A19', TXT = '#EEF2E6', MUTE = '#8E9883';
const CELL = 8, EDGE = PHONE ? 0.915 : 0.885;
const assets = { logo: '/brand/logo/adrender-logo-1024.png', yb: '/showcase/yourbrand-logo.webp', tpl: '/showcase/shoe-template.webp', out: '/showcase/shoe-output.webp', r2: '/showcase/ad-02.webp', r3: '/showcase/vad-03.webp' };

// ---------- helpers ----------
let g = ctx;
const mono = (txt, x, y, size = 18, color = MUTE, align = 'left') => { g.save(); g.font = `500 ${size}px Mono`; g.fillStyle = color; g.textAlign = align; g.letterSpacing = '0.5px'; g.fillText(txt, x, y); g.restore(); };
function caption(t, text, a, b, y) {
  const size = PHONE ? 64 : 62; y = y ?? (PHONE ? H - 215 : H - 150);
  words(g, { text, x: W / 2, y, size, weight: 600, t, in: a, out: b, grad: ['#FFFFFF', '#B7C2A6'], shadow: 'rgba(0,0,0,0.95)' });
}
function caption2(t, l1, l2, a, b) {
  if (PHONE) { caption(t, l1, a, b, H - 290); caption(t, l2, a + 0.2, b, H - 210); } else caption(t, `${l1} ${l2}`, a, b);
}
// a card in the node-graph style: dark fill, hairline border, lime status dot, mono label
function card(x, y, w, h, label, k = 1, glow = 0) {
  if (k <= 0) return; const e = EASE.premium(k);
  g.save(); g.globalAlpha = clamp01(k * 2); g.translate(x, y + (1 - e) * 26);
  if (glow > 0) { g.shadowColor = `rgba(200,255,46,${0.35 * glow})`; g.shadowBlur = 40 * glow * SCALE; }
  g.beginPath(); g.roundRect(-w / 2, -h / 2, w, h, 22); g.fillStyle = CARD; g.fill(); g.shadowBlur = 0; g.lineWidth = 1.5; g.strokeStyle = glow > 0 ? `rgba(200,255,46,${0.25 + 0.5 * glow})` : LINE; g.stroke();
  g.fillStyle = LIME; g.beginPath(); g.arc(w / 2 - 26, -h / 2 + 30, 5, 0, 7); g.fill();
  mono(label, -w / 2 + 24, -h / 2 + 36, 18, TXT);
  g.restore();
  return { x: x - w / 2, y: y - h / 2 + (1 - e) * 26, a: clamp01(k * 2) };
}
// draw `src` into a box through a pixel-dissolve mask (cells switch on in Bayer order)
function maskedImage(im, x, y, w, h, r, k, cell = 14, dir = [0.3, 1]) {
  if (k <= 0 || !im) return; if (k >= 1) { drawCover(g, im, x, y, w, h, r); return; }
  const c = A.small('miC', Math.ceil(w * SCALE), Math.ceil(h * SCALE)), cg = c.g; cg.setTransform(SCALE, 0, 0, SCALE, 0, 0); cg.globalCompositeOperation = 'source-over'; cg.clearRect(0, 0, w, h); drawCover(cg, im, 0, 0, w, h, r);
  const cols = Math.ceil(w / cell), rows = Math.ceil(h / cell), m = A.small('mi', cols, rows), id = m.g.createImageData(cols, rows);
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) if (dissolve(k, (i + .5) / cols, (j + .5) / rows, i, j, dir, 0.5)) id.data[(j * cols + i) * 4 + 3] = 255;
  m.g.putImageData(id, 0, 0); cg.globalCompositeOperation = 'destination-in'; cg.imageSmoothingEnabled = false; cg.drawImage(m, 0, 0, cols * cell, rows * cell);
  cg.globalCompositeOperation = 'source-over'; cg.imageSmoothingEnabled = true;

}
function limeImage(im, x, y, w, h, alpha = 1, cell = 5, key = 'li') {
  if (!im || alpha <= 0) return; const c = A.small(key + 'c', Math.ceil(w), Math.ceil(h)); c.g.clearRect(0, 0, c.width, c.height); drawCover(c.g, im, 0, 0, c.width, c.height, 0);
  g.save(); g.beginPath(); g.roundRect(x, y, w, h, 14); g.clip(); g.fillStyle = '#0A0D07'; g.fillRect(x, y, w, h);
  ditherSource(g, c, { x, y, w, h, cell, on: LIME, gain: 1.25, bias: -0.05, key, alpha }); g.restore();
}

// ---------- background fields (always moving) ----------
function bgField(t, mode) {
  ditherField(g, { cell: CELL, on: LIME, off: BLACK, key: 'bg', phaseX: 0, field: (u, v) => {
    const ar = W / H;
    if (mode === 'halo') { const dx = (u - 0.5) * ar, dy = v - (PHONE ? 0.42 : 0.47), d = Math.sqrt(dx * dx + dy * dy); const ring = Math.exp(-Math.pow((d - 0.08 - 0.05 * Math.sin(t * 0.8)) / (PHONE ? 0.11 : 0.18), 2)); return ring * (PHONE ? 0.2 : 0.3) * A.prog(t, 0, 1.2) + Math.pow(Math.max(0, v - EDGE) / (1 - EDGE), 1.6) * 0.8; }
    if (mode === 'edge') { const w = 0.04 * Math.sin(u * 9 + t * 1.3) + 0.03 * Math.sin(u * 23 - t * 0.9); return Math.pow(clamp01((v - EDGE + w * 0.6) / (1 - EDGE)), 1.4) * 0.95; }
    if (mode === 'top') { const w = 0.04 * Math.sin(u * 7 - t * 1.1); return Math.pow(clamp01((0.22 - v + w) / 0.22), 1.6) * 0.9; }
    if (mode === 'rise') { const w = 0.05 * Math.sin(u * 6 + t * 1.6) + 0.025 * Math.sin(u * 17 - t * 2.1); const lvl = (PHONE ? 0.68 : 0.78) - 0.08 * A.prog(t, 26.8, 31); return Math.pow(clamp01((v - lvl + w) / (1 - lvl)), 1.25) * 1.0; }
    return 0;
  } });
}
function dotGrid(alpha) { g.save(); g.globalAlpha = alpha; g.fillStyle = '#1D2316'; for (let y = 24; y < H; y += 32) for (let x = 24; x < W; x += 32) g.fillRect(x, y, 2, 2); g.restore(); }

// ---------- scene 1: phyllotaxis bloom -> 50% ----------
const N = 460, GA = 137.508 * Math.PI / 180;
const GLYPH = { cx: W / 2, cy: PHONE ? H * 0.40 : H * 0.44, size: PHONE ? 400 : 420 };
let targets = null;
function glyphCanvas() {
  const c = mk(), x = c.getContext('2d'); x.setTransform(SCALE, 0, 0, SCALE, 0, 0); x.fillStyle = '#fff'; x.font = `700 ${GLYPH.size}px Inter`; x.letterSpacing = `${-0.05 * GLYPH.size}px`; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('50%', GLYPH.cx, GLYPH.cy); return c;
}
let GC;
function buildTargets() {
  GC = glyphCanvas(); const d = GC.getContext('2d').getImageData(0, 0, GC.width, GC.height).data, pts = [], step = 9 * SCALE;
  for (let y = 0; y < GC.height; y += step) for (let x = 0; x < GC.width; x += step) if (d[(Math.floor(y) * GC.width + Math.floor(x)) * 4 + 3] > 128) pts.push([x / SCALE, y / SCALE]);
  // pick N spread out, sorted by angle around the centre so dots travel without crossing much
  const pick = []; for (let i = 0; i < N; i++) pick.push(pts[Math.floor(i * pts.length / N)]);
  const ang = p => Math.atan2(p[1] - GLYPH.cy, p[0] - GLYPH.cx);
  pick.sort((a, b) => ang(a) - ang(b));
  targets = pick;
}
const dots = mk(), dotsG = dots.getContext('2d');
function sceneGrowth(t) {
  bgField(t, 'halo');
  const rot = t * 0.08, c = PHONE ? 15.5 : 16.5, toGlyph = i => EASE.inOut(prog(t, 4.4 + (i / N) * 0.9, 5.9 + (i / N) * 0.9));
  // spiral positions in angle order to match targets
  const src = []; for (let n = 0; n < N; n++) { const r = c * Math.sqrt(n + 1), th = n * GA + rot; src.push([GLYPH.cx + r * Math.cos(th), GLYPH.cy + r * Math.sin(th), n]); }
  const ang = p => Math.atan2(p[1] - GLYPH.cy, p[0] - GLYPH.cx); const order = src.slice().sort((a, b) => ang(a) - ang(b));
  dotsG.setTransform(SCALE, 0, 0, SCALE, 0, 0); dotsG.clearRect(0, 0, W, H);
  const fill = EASE.standard(prog(t, 5.8, 7.0));
  order.forEach((p, i) => {
    const n = p[2], born = EASE.premium(prog(t, 0.15 + (n / N) * 3.0, 0.9 + (n / N) * 3.0)); if (born <= 0) return;
    const k = toGlyph(i), tg = targets[i], x = lerp(p[0], tg[0], k), y = lerp(p[1], tg[1], k), r = lerp(4 + 9 * (n / N), 7, k) * born * (1 - 0.6 * fill);
    const gr = dotsG.createRadialGradient(x, y, 0, x, y, r * 1.9); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.5, 'rgba(255,255,255,0.8)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    dotsG.fillStyle = gr; dotsG.beginPath(); dotsG.arc(x, y, r * 1.9, 0, 7); dotsG.fill();
  });
  ditherSource(g, dots, { cell: 6, on: LIME, key: 'dots', gain: 1.1 });

  if (fill > 0) {
    const top = (GLYPH.cy - GLYPH.size * 0.36) / H, bot = (GLYPH.cy + GLYPH.size * 0.38) / H;
    ditherSource(g, GC, { cell: 6, on: LIME, mode: 'alpha', key: 'glyph', mask: (u, v) => fill * lerp(1.05, 0.28, clamp01((v - top) / (bot - top))) });
  }

  const hud = EASE.standard(prog(t, 0.6, 1.6)) * (1 - prog(t, 8.8, 9.4));
  if (hud > 0) {
    g.save(); g.globalAlpha = hud; const m = PHONE ? 60 : 72;
    mono('BLACK FRIDAY / 2026', m, m + 10, 20, TXT); mono('ADRENDER — SALE 01', W - m, m + 10, 20, MUTE, 'right');
    mono(`phyllotaxis ${(137.5).toFixed(1)}°`, m, H - m - (PHONE ? 330 : 140), 18); mono(`n = ${Math.min(N, Math.floor(N * prog(t, 0.15, 3.2)))}`, m, H - m - (PHONE ? 304 : 114), 18);
    mono(fill > 0.5 ? 'form: 50%' : 'growth: ' + prog(t, 0.15, 3.2).toFixed(2), W - m, H - m - (PHONE ? 330 : 140), 18, MUTE, 'right');
    g.restore();
  }
  caption(t, 'Black Friday.', 0.9, 4.2);
  caption2(t, '50% off your first month,', 'on every plan.', 6.3, 9.3);
}

// ---------- scene 2: node graph (brand + winning ad + skill -> your ads) ----------
const NG = PHONE ? {
  brand: [540, 330, 520, 230], tpl: [290, 760, 440, 470], skill: [790, 700, 440, 330], hub: [540, 1050], res: [540, 1360, 760, 420],
} : {
  brand: [330, 480, 380, 260], tpl: [860, 255, 380, 320], skill: [860, 715, 380, 250], hub: [1180, 480], res: [1560, 470, 430, 500],
};
function wire(ax, ay, bx, by, k, horiz = true) {
  if (k <= 0) return; g.save(); g.strokeStyle = LIME; g.lineWidth = 2.5; g.shadowColor = 'rgba(200,255,46,0.7)'; g.shadowBlur = 10 * SCALE;
  const p = new Path2D(); const mx = (ax + bx) / 2, my = (ay + by) / 2;
  if (horiz) p.moveTo(ax, ay), p.bezierCurveTo(mx, ay, mx, by, bx, by); else p.moveTo(ax, ay), p.bezierCurveTo(ax, my, bx, my, bx, by);
  const len = Math.hypot(bx - ax, by - ay) * 1.25; g.setLineDash([len * k, len]); g.stroke(p);
  g.setLineDash([]); g.fillStyle = LIME; g.beginPath(); g.arc(ax, ay, 5, 0, 7); g.fill(); if (k > 0.98) { g.beginPath(); g.arc(bx, by, 5, 0, 7); g.fill(); }
  g.restore();
}
function sceneGraph(t) {
  bgField(t, 'edge'); dotGrid(EASE.standard(prog(t, 9.6, 10.6)));
  const z = 1 + 0.035 * sine(prog(t, 9.6, 19.8)); g.save(); g.translate(W / 2, H / 2); g.scale(z, z); g.translate(-W / 2, -H / 2);
  const [bx, by, bw, bh] = NG.brand, [tx, ty, tw, th] = NG.tpl, [sx, sy, sw, sh] = NG.skill, [hx, hy] = NG.hub, [rx, ry, rw, rh] = NG.res;
  const kB = third(t, 10.0, 1.2, 0), kT = third(t, 10.0, 1.2, 1), kS = third(t, 10.0, 1.2, 2);
  // brand kit
  const b = card(bx, by, bw, bh, 'Brand kit', kB);
  if (b) { g.save(); g.globalAlpha = b.a; drawCover(g, IMG.yb, b.x + 24, b.y + 62, 72, 72, 36); g.font = '600 30px Inter'; g.fillStyle = TXT; g.fillText('YourBrand', b.x + 112, b.y + 96); mono('logo · colors · voice', b.x + 112, b.y + 124, 16);
    ['#1D3A7A', '#C8202F', '#F2EDE4', '#0B0B0B'].forEach((c, i) => { g.fillStyle = c; g.beginPath(); g.roundRect(b.x + 24 + i * 58, b.y + bh - 70, 46, 46, 10); g.fill(); g.strokeStyle = LINE; g.stroke(); }); g.restore(); }
  // template (winning ad), shown dithered
  const tc = card(tx, ty, tw, th, 'Winning ad', kT);
  if (tc) { const iw = tw - 48, ih = th - 84; limeImage(IMG.tpl, tc.x + 24, tc.y + 60, iw, ih, tc.a, 5, 'tplimg'); }
  // skill
  const sc = card(sx, sy, sw, sh, 'Skill · Clone', kS);
  if (sc) { g.save(); g.globalAlpha = sc.a; mono('Match the layout', sc.x + 24, sc.y + 92, 17, TXT); mono('Swap in your product', sc.x + 24, sc.y + 122, 17, TXT);
    const sl = sc.x + 24, sw2 = sw - 48, syy = sc.y + sh - 70, kk = 0.35 + 0.3 * EASE.inOut(prog(t, 12.4, 14.0));
    g.beginPath(); g.roundRect(sl, syy, sw2, 40, 20); g.fillStyle = '#151A10'; g.fill(); g.beginPath(); g.roundRect(sl, syy, sw2 * kk, 40, 20); g.fillStyle = TXT; g.fill();
    g.fillStyle = '#111'; g.beginPath(); g.arc(sl + sw2 * kk - 20, syy + 20, 14, 0, 7); g.fill(); mono('Image', sl + 16, syy + 26, 15, '#111'); mono('Video', sl + sw2 - 16, syy + 26, 15, MUTE, 'right'); g.restore(); }
  // wires (1/3 rule)
  const w1 = third(t, 11.6, 1.0, 0), w2 = third(t, 11.6, 1.0, 1), w3 = third(t, 11.6, 1.0, 2), w4 = third(t, 11.6, 1.0, 3), w5 = EASE.inOut(prog(t, 13.8, 14.6));
  if (PHONE) {
    wire(bx - 120, by + bh / 2, tx, ty - th / 2, w1, false); wire(bx + 120, by + bh / 2, sx, sy - sh / 2, w2, false);
    wire(tx, ty + th / 2, hx - 40, hy, w3, false); wire(sx, sy + sh / 2, hx + 40, hy, w4, false); wire(hx, hy + 44, rx, ry - rh / 2, w5, false);
  } else {
    wire(bx + bw / 2, by, tx - tw / 2, ty, w1); wire(bx + bw / 2, by, sx - sw / 2, sy, w2);
    wire(tx, ty + th / 2, hx - 44, hy, w3, false); wire(sx, sy - sh / 2, hx - 44, hy, w4, false); wire(hx + 44, hy, rx - rw / 2, ry, w5);
  }

  if (hk > 0) { g.save(); g.globalAlpha = hk; g.translate(hx, hy); g.scale(lerp(0.6, 1, hk) * (1 + 0.08 * pulse), lerp(0.6, 1, hk) * (1 + 0.08 * pulse));
    g.shadowColor = `rgba(200,255,46,${0.3 + 0.6 * pulse})`; g.shadowBlur = (20 + 40 * pulse) * SCALE; g.beginPath(); g.roundRect(-44, -44, 88, 88, 22); g.fillStyle = '#10130C'; g.fill(); g.shadowBlur = 0; g.strokeStyle = LINE; g.lineWidth = 1.5; g.stroke();
    g.fillStyle = pulse > 0.2 ? LIME : TXT; g.beginPath(); g.moveTo(6, -24); g.lineTo(-14, 4); g.lineTo(-1, 4); g.lineTo(-6, 24); g.lineTo(14, -4); g.lineTo(1, -4); g.closePath(); g.fill(); g.restore(); }

    const list = [IMG.r3, IMG.r2, IMG.out], iw = PHONE ? 210 : 250, ih = iw * 522 / 420;
    list.forEach((im, i) => {
      const k = EASE.premium(third(t, 14.6, 1.1, i)); if (k <= 0) return;
      const spread = PHONE ? 230 : 70, ox = PHONE ? (i - 1) * spread : (i - 1) * spread, oy = PHONE ? 0 : (i - 1) * -26, rot = PHONE ? 0 : (i - 1) * 0.07;
      const cx = rx + ox * k, cy = ry + 26 + oy * k;
      g.save(); g.globalAlpha = rc.a; g.translate(cx, cy); g.rotate(rot * k); g.translate(-iw / 2, -ih / 2);

}

// ---------- scene 3: bento grid ----------
function sceneBento(t) {
  bgField(t, 'top');
  const t0 = 19.7;
  const gap = 20; let cells;
  if (PHONE) {
    const x0 = 60, w = W - 120, hw = (w - gap) / 2;
    cells = [[x0, 300, w, 520], [x0, 840, hw, 380], [x0 + hw + gap, 840, hw, 380], [x0, 1240, hw, 380], [x0 + hw + gap, 1240, hw, 380]];
  } else {
    const x0 = 210, y0 = 120, cw = [600, 470, 470], ch = 360;
    cells = [[x0, y0, cw[0], ch * 2 + gap], [x0 + cw[0] + gap, y0, cw[1], ch], [x0 + cw[0] + cw[1] + gap * 2, y0, cw[2], ch], [x0 + cw[0] + gap, y0 + ch + gap, cw[1], ch], [x0 + cw[0] + cw[1] + gap * 2, y0 + ch + gap, cw[2], ch]];
  }

    const k = EASE.premium(third(t, t0, 1.2, i)); if (k <= 0) return;
    g.save(); g.globalAlpha = clamp01(k * 2); g.translate(x, y + (1 - k) * 40 - drift * (i % 2 ? 1 : -0.6));

      g.beginPath(); g.roundRect(0, 0, w, h, 26); g.fillStyle = LIME; g.fill();

      g.save(); g.beginPath(); g.roundRect(0, 0, w, h, 26); g.clip(); ditherField(g, { x: 0, y: h * 0.68, w, h: h * 0.32, cell: 8, on: '#0A0C06', key: 'limeShade', field: (u, v) => Math.pow(v, 1.4) * 0.85 + 0.05 * Math.sin(u * 10 + t * 2) }); g.restore();
      mono('BLACK FRIDAY', 32, 52, 20, '#0A0C06'); mono('01', w - 32, 52, 20, '#0A0C06', 'right');
      const big = PHONE ? 230 : 250; g.font = `700 ${big}px Inter`; g.letterSpacing = `${-0.05 * big}px`; g.fillStyle = '#0A0C06'; g.fillText('50%', 26, PHONE ? 290 : 330);
      g.font = '600 44px Inter'; g.letterSpacing = '-1.2px'; g.fillText('off your first month', 34, PHONE ? 360 : 410);
    } else {
      g.beginPath(); g.roundRect(0, 0, w, h, 26); g.fillStyle = CARD; g.fill(); g.lineWidth = 1.5; g.strokeStyle = LINE; g.stroke();
      const title = ['', 'Image ads', 'Video ads', 'Every plan', 'One week only'][i];
      g.font = `600 ${PHONE ? 38 : 40}px Inter`; g.letterSpacing = '-1px'; g.fillStyle = TXT; g.fillText(title, 28, 64);
      const sub = ['', 'from winning templates', 'from winning templates', 'first month, half off', 'Black Friday sale'][i]; mono(sub, 30, 98, 17);
      const ix = 28, iy = 128, iw = w - 56, ih = h - 156;
      if (i === 1) { // dithered bars rising
        for (let b = 0; b < 9; b++) { const bh = ih * (0.25 + 0.7 * Math.abs(Math.sin(b * 1.7 + 0.6))) * EASE.premium(third(t, t0 + 0.8, 0.9, b * 0.6)); const bw2 = iw / 9 - 10; if (bh < 2) continue;
          ditherField(g, { x: ix + b * (iw / 9), y: iy + ih - bh, w: bw2, h: bh, cell: 6, on: LIME, key: 'bar', field: (u, v) => lerp(1, 0.25, v) }); }
      }
      if (i === 2) { // dithered wave and a play button
        ditherField(g, { x: ix, y: iy, w: iw, h: ih, cell: 6, on: LIME, key: 'wave', field: (u, v) => { const yy = 0.5 + 0.28 * Math.sin(u * 9 - t * 2.4) * Math.sin(u * 3.1); return Math.exp(-Math.pow((v - yy) / 0.12, 2)) * 1.1; } });
        g.fillStyle = TXT; g.beginPath(); g.arc(ix + iw / 2, iy + ih / 2, 34, 0, 7); g.fill(); g.fillStyle = '#0A0C06'; g.beginPath(); g.moveTo(ix + iw / 2 - 10, iy + ih / 2 - 15); g.lineTo(ix + iw / 2 + 16, iy + ih / 2); g.lineTo(ix + iw / 2 - 10, iy + ih / 2 + 15); g.fill();
      }
      if (i === 3) { // curl growth (nature)
        g.save(); g.strokeStyle = TXT; g.lineCap = 'round';
        for (let c = 0; c < 4; c++) { const gk = EASE.premium(third(t, t0 + 1.0, 1.3, c)); if (gk <= 0) continue; const x0 = ix + 30 + c * (iw / 4.2), y0 = iy + ih; g.lineWidth = 9 - c; g.beginPath();
          for (let s = 0; s <= 40 * gk; s++) { const u = s / 40, x = x0 + Math.pow(u, 2.2) * 70, y = y0 - u * ih * 0.9; s ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); }
        g.restore(); mono('curl', ix + iw, iy + ih + 4, 15, MUTE, 'right');
      }
      if (i === 4) { // seven day blocks
        const bs = Math.min((iw - 6 * 10) / 7, ih * 0.6), y2 = iy + (ih - bs) / 2;
        for (let d = 0; d < 7; d++) { const dk = EASE.premium(third(t, t0 + 1.2, 0.7, d * 0.5)); ditherField(g, { x: ix + d * (bs + 10), y: y2, w: bs, h: bs, cell: 6, on: LIME, key: 'day', field: (u, v) => dk * (0.55 + 0.45 * (1 - v)) }); }
        mono('7 days', ix, y2 + bs + 30, 16);
      }
    }
    g.restore();
  });
  if (PHONE) caption(t, 'Image and video ads.', 21.4, 27.0, 1760); else caption(t, 'Image and video ads for your brand.', 21.4, 27.0, H - 56);
}

// ---------- scene 4: one week only ----------
function sceneWeek(t) {
  bgField(t, 'rise');
  const cy = PHONE ? H * 0.36 : H * 0.36, bs = PHONE ? 112 : 120, gap = PHONE ? 16 : 22, tot = 7 * bs + 6 * gap, x0 = W / 2 - tot / 2;
  for (let d = 0; d < 7; d++) {
    const k = EASE.premium(third(t, 27.0, 0.8, d * 0.6)); if (k <= 0) continue;
    const lit = 1 - 0.75 * EASE.inOut(prog(t, 29.0 + d * 0.22, 29.5 + d * 0.22)) * (d > 0 ? 1 : 0);   // days tick away, the first stays lit
    g.save(); g.globalAlpha = k; g.beginPath(); g.roundRect(x0 + d * (bs + gap), cy - bs / 2 + (1 - k) * 30, bs, bs, 16); g.fillStyle = CARD; g.fill(); g.strokeStyle = LINE; g.lineWidth = 1.5; g.stroke(); g.restore();
    ditherField(g, { x: x0 + d * (bs + gap) + 10, y: cy - bs / 2 + 10 + (1 - k) * 30, w: bs - 20, h: bs - 20, cell: 6, on: LIME, key: 'wk', alpha: k, field: (u, v) => lit * (0.95 - 0.55 * v) });
    mono(`D${d + 1}`, x0 + d * (bs + gap) + bs / 2, cy + bs / 2 + 34 + (1 - k) * 30, 16, MUTE, 'center');
  }
  words(g, { text: 'One week only.', x: W / 2, y: PHONE ? H * 0.56 : H * 0.60, size: PHONE ? 104 : 120, weight: 600, t, in: 27.6, out: 31.0, grad: ['#FFFFFF', '#B7C2A6'] });
  words(g, { text: '50% off your first month. Every plan.', x: W / 2, y: PHONE ? H * 0.56 + 90 : H * 0.60 + 74, size: PHONE ? 38 : 36, weight: 500, t, in: 28.4, out: 31.0, color: MUTE, track: 0 });
}

// ---------- scene 5: end card ----------
function sceneEnd(t) {
  const k = EASE.premium(prog(t, 31.2, 33.0)), cy = PHONE ? H * 0.40 : H * 0.36, lh = PHONE ? 220 : 170;
  ditherField(g, { cell: CELL, on: LIME, off: BLACK, key: 'bg', field: (u, v) => { const dx = (u - 0.5) * W / H, dy = v - (PHONE ? 0.47 : 0.47), d = Math.sqrt(dx * dx + dy * dy); const r = lerp(1.25, PHONE ? 0.36 : 0.52, k); return Math.exp(-Math.pow((d - r) / 0.045, 2)) * 0.95 + Math.exp(-Math.pow((d - r - 0.09) / 0.07, 2)) * 0.35; } });
  logo(g, W / 2, cy, lh * lerp(0.7, 1, k), clamp01(k * 1.5));
  const ty = cy + lh / 2 + (PHONE ? 130 : 110);
  words(g, { text: 'AdRender', x: W / 2, y: ty, size: PHONE ? 90 : 76, weight: 600, t, in: 32.0, grad: ['#FFFFFF', '#C9D2BB'] });
  const bk = EASE.standard(prog(t, 32.6, 33.4));
  if (bk > 0) { const bw = PHONE ? 470 : 380, bh = PHONE ? 84 : 68, by = ty + (PHONE ? 60 : 46); g.save(); g.globalAlpha = bk; g.beginPath(); g.roundRect(W / 2 - bw / 2, by + (1 - bk) * 14, bw, bh, 12); g.fillStyle = LIME; g.fill(); g.restore();
    g.save(); g.globalAlpha = bk; mono('adrender.app', W / 2, by + bh / 2 + 10 + (1 - bk) * 14, PHONE ? 34 : 30, '#0A0C06', 'center'); g.restore();
    words(g, { text: 'Black Friday · 50% off your first month · One week only', x: W / 2, y: by + bh + (PHONE ? 80 : 60), size: PHONE ? 30 : 26, weight: 500, t, in: 33.6, stagger: 0.03, color: MUTE, track: 0, shadow: '#000' }); }
}

// ---------- compositor with pixel-dissolve transitions ----------
const S = [mk(), mk()];
function draw(fn, t, c) { const x = c.getContext('2d'); g = x; begin(x); x.fillStyle = BLACK; x.fillRect(0, 0, W, H); fn(t); g = ctx; return c; }
const CUTS = [ // [start of wipe, length, from, to, direction]
  [9.4, 0.9, sceneGrowth, sceneGraph, [1, 0.25]],
  [19.0, 0.9, sceneGraph, sceneBento, [-0.3, 1]],
  [26.6, 0.9, sceneBento, sceneWeek, [1, -0.4]],
  [31.0, 0.9, sceneWeek, sceneEnd, [0, -1]],
];
function render(t) {
  if (!targets) buildTargets();
  let cur = sceneGrowth;
  for (const [a, len, from, to, dir] of CUTS) {
    if (t >= a && t < a + len) { draw(from, t, S[0]); draw(to, t, S[1]); begin(ctx); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(S[0], 0, 0); pixelWipe(ctx, S[1], EASE.inOut(prog(t, a, a + len)), { cell: 24, dir, spread: 0.6 }); return; }
    if (t >= a + len) cur = to;
  }
  g = ctx; begin(ctx); ctx.fillStyle = BLACK; ctx.fillRect(0, 0, W, H); cur(t);
}
AD.start(TOTAL, render, assets);
